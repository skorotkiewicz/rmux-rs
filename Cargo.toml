[package]
name = "rmux-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.101"
dirs = "6.0.0"
eframe = { version = "0.33.3", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence"] }
egui = "0.33.3"
egui_dock = "0.18.0"
futures-util = "0.3.32"
glob = "0.3.3"
reqwest = { version = "0.13.2", features = ["json"] }
rmcp = { version = "0.16.0", features = ["client", "transport-child-process", "transport-streamable-http-client", "transport-streamable-http-client-reqwest", "reqwest"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros"] }
tokio-stream = "0.1.18"
uuid = { version = "1.21.0", features = ["v4", "serde"] }
