[package]
name = "rmux-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
# Configuration management
dirs = "6.0.0"

# Error handling
anyhow = "1.0.101"

# GUI framework (egui - cross-platform)
eframe = { version = "0.33.3", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence"] }
egui = "0.33.3"
egui-phosphor = "0.11.0"          # Phosphor icons for egui
egui_dock = "0.18.0"              # Dockable tabs support

# Async utilities
futures-util = "0.3.32"           # Stream utilities for async

# HTTP client for OpenAI-compatible API
reqwest = { version = "0.13.2", features = ["json"] }

# MCP (Model Context Protocol) client
rmcp = { version = "0.16.0", features = ["client", "transport-child-process", "transport-streamable-http-client", "transport-streamable-http-client-reqwest", "reqwest"] }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"            # JSON serialization for API
serde_yaml = "0.9.34"             # YAML config file parsing

# Async runtime
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros"] }
tokio-stream = "0.1.18"           # Stream extensions for tokio

# Unique identifiers for tabs and workspaces
uuid = { version = "1.21.0", features = ["v4", "serde"] }

[profile.release]
opt-level = "s"
debug = false
lto = "fat"
codegen-units = 1
panic = "abort"
incremental = false
strip = true

# opt-level = 3   # Maximum performance. I don’t care how big it gets. Make it fast.
# opt-level = "z" # Minimum size. I care about binary size more than raw speed.
# opt-level = "s" # Optimize for size, but not as aggressively as "z".